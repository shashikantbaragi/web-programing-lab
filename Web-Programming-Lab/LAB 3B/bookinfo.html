<!DOCTYPE html>
<html>
<head>
    <title>Book Information</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #050816;
            color: white;
        }

        .card {
            width: 70%;
            margin: 60px auto;
            padding: 40px;
            text-align: center;
            background: rgba(255,255,255,0.06);
            border: 1px solid #00ffff;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0,255,255,0.15);
        }

        .icon {
            font-size: 70px;
        }

        h1 {
            color: #00ffff;
            text-shadow: 0 0 15px #00ffff;
        }

        p {
            color: #aeb8ce;
            line-height: 1.7;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="icon">📚</div>

        <h1>BOOK INFORMATION</h1>

        <p>
            Select a book from the left side
            to view its information.
        </p>

    </div>

</body>
</html>
