<!DOCTYPE html>
<html>
<head>
    <title>The Great Gatsby</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #050816;
            color: white;
            text-align: center;
        }

        .card {
            width: 75%;
            margin: 40px auto;
            padding: 35px;
            background: rgba(255,255,255,0.06);
            border: 1px solid #00ffff;
            border-radius: 22px;
            box-shadow:
                0 20px 50px rgba(0,0,0,0.6),
                0 0 25px rgba(0,255,255,0.12);
            transition: 0.4s;
        }

        .card:hover {
            transform: perspective(900px)
                       rotateX(3deg)
                       rotateY(-4deg)
                       translateY(-5px);
            box-shadow: 0 0 35px rgba(0,255,255,0.25);
        }

        .cover {
            font-size: 85px;
            filter: drop-shadow(0 0 18px #00ffff);
        }

        h1 {
            color: #00ffff;
            text-shadow: 0 0 15px #00ffff;
            letter-spacing: 3px;
        }

        .line {
            width: 100px;
            height: 2px;
            margin: 20px auto;
            background: #00ffff;
            box-shadow: 0 0 15px #00ffff;
        }

        .info {
            color: #aeb8ce;
            line-height: 1.8;
        }

        b {
            color: white;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="cover">📘</div>

        <h1>THE GREAT GATSBY</h1>

        <div class="line"></div>

        <div class="info">

            <p><b>Author:</b> F. Scott Fitzgerald</p>

            <p><b>Genre:</b> Fiction & Classic</p>

            <p><b>Language:</b> English</p>

            <p>
                A classic story exploring dreams, love,
                wealth, friendship and society.
            </p>

        </div>

    </div>

</body>
</html>
