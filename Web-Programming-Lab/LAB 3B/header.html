<!DOCTYPE html>
<html>

<head>

<style>

body {
    margin: 0;
    font-family: Arial;
    background: #050816;
    color: white;
}

h2 {
    text-align: center;
    color: #00ffff;
    letter-spacing: 2px;
    padding: 15px;
}

.book {
    margin: 15px;
    padding: 20px;
    background: rgba(255,255,255,.06);
    border: 1px solid #263452;
    border-radius: 15px;
    transition: .4s;
}

.book:hover {
    transform: perspective(600px) rotateY(-8deg) translateX(8px);
    border-color: #00ffff;
    box-shadow: 0 0 25px rgba(0,255,255,.2);
}

.book a {
    color: white;
    text-decoration: none;
    font-weight: bold;
}

.icon {
    font-size: 35px;
    margin-bottom: 8px;
}

</style>

</head>

<body>

<h2>📚 BOOK COLLECTION</h2>

<div class="book">
    <div class="icon">📕</div>
    <a href="book1.html" target="bookinfo">
        THE ALCHEMIST
    </a>
</div>

<div class="book">
    <div class="icon">📘</div>
    <a href="book2.html" target="bookinfo">
        THE GREAT GATSBY
    </a>
</div>

<div class="book">
    <div class="icon">📗</div>
    <a href="book3.html" target="bookinfo">
        THE HOBBIT
    </a>
</div>

</body>
</html>
