<!DOCTYPE html>
<html>

<head>

<style>

body {
    margin: 0;
    font-family: Arial;
    background: #050816;
    color: white;
    text-align: center;
}

.card {
    width: 75%;
    margin: 35px auto;
    padding: 30px;
    background: rgba(255,255,255,.06);
    border: 1px solid #00ffff;
    border-radius: 20px;
    box-shadow: 0 0 30px rgba(0,255,255,.1);
}

.cover {
    font-size: 80px;
}

h1 {
    color: #00ffff;
    text-shadow: 0 0 15px #00ffff;
}

.info {
    line-height: 2;
    color: #aeb8ce;
}

</style>

</head>

<body>

<div class="card">

    <div class="cover">📕</div>

    <h1>THE ALCHEMIST</h1>

    <div class="info">

        <p><b>Author:</b> Paulo Coelho</p>
        <p><b>Genre:</b> Fiction & Adventure</p>
        <p><b>Language:</b> English</p>

        <p>
            A story about dreams, purpose,
            courage and discovering your destiny.
        </p>

    </div>

</div>

</body>

</html>
