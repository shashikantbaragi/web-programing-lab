<!DOCTYPE html>
<html>
<head>
    <title>Future Cultural Festival</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="scene">

    <div class="orb orb1"></div>
    <div class="orb orb2"></div>

    <div class="form-card">

        <div class="header">

            <div class="icon">🎭</div>

            <p class="tag">◈ DIGITAL EVENT PORTAL 2026 ◈</p>

            <h1>CULTURAL<br><span>FESTIVAL</span></h1>

            <p>YOUR TALENT • YOUR STAGE • YOUR MOMENT</p>

        </div>

        <form>

            <label>👤 FULL NAME</label>

            <input
                type="text"
                placeholder="Enter your full name"
                required
            >


            <label>📧 EMAIL</label>

            <input
                type="email"
                placeholder="Enter your email"
                required
            >


            <label>📱 PHONE NUMBER</label>

            <input
                type="tel"
                placeholder="Enter your phone number"
            >


            <label>🏫 INSTITUTE</label>

            <input
                type="text"
                placeholder="Enter your institute"
            >


            <label>⚧ GENDER</label>

            <div class="choice">

                <label>
                    <input type="radio" name="gender">
                    Male
                </label>

                <label>
                    <input type="radio" name="gender">
                    Female
                </label>

                <label>
                    <input type="radio" name="gender">
                    Other
                </label>

            </div>


            <label>🎤 SELECT EVENTS</label>

            <div class="events">

                <label>
                    <input type="checkbox">
                    💃 Dance
                </label>

                <label>
                    <input type="checkbox">
                    🎤 Singing
                </label>

                <label>
                    <input type="checkbox">
                    🎨 Drawing
                </label>

                <label>
                    <input type="checkbox">
                    🧠 Quiz
                </label>

            </div>


            <label>🏆 EXPERIENCE LEVEL</label>

            <select>

                <option>-- SELECT LEVEL --</option>
                <option>Beginner</option>
                <option>Intermediate</option>
                <option>Advanced</option>

            </select>


            <label>📍 ADDRESS</label>

            <textarea
                rows="5"
                placeholder="Enter your address">
            </textarea>


            <div class="buttons">

                <input type="submit" value="⚡ REGISTER">

                <input type="reset" value="↻ RESET">

            </div>

        </form>

    </div>

</div>

</body>
</html>
